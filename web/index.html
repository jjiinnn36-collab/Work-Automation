<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>납부 기한 알림</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="화면">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>납부 기한 알림</span></div>
    <div class="nav">
      <a href="#alerts" data-view="alerts">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5a4.2 4.2 0 0 0-4.2 4.2c0 3.4-1.3 4.4-1.3 4.4h11c0 0-1.3-1-1.3-4.4A4.2 4.2 0 0 0 9 2.5Z"/><path d="M7.4 13.6a1.8 1.8 0 0 0 3.2 0"/></svg>
        <span class="label">받은 알림</span><span class="badge" id="badge" hidden></span>
      </a>
      <a href="#month" data-view="month">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="12" rx="2"/><path d="M6 2v3M12 2v3M2.5 8h13"/></svg>
        <span class="label">이번 달</span>
      </a>
      <a href="#year" data-view="year">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="2"/><path d="M2.5 6.8h13M6.8 6.8v8.7M11.2 6.8v8.7"/></svg>
        <span class="label">연간</span>
      </a>
      <a href="#items" data-view="items">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 14V7M7 14V4M11 14V9M15 14v-4"/></svg>
        <span class="label">항목 관리</span>
      </a>
      <a href="#history" data-view="history">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6.5"/><path d="M9 5.5V9l2.4 1.6"/></svg>
        <span class="label">이력</span>
      </a>
    </div>
  </nav>
  <main id="main" class="main" tabindex="-1"><div class="loading">불러오는 중…</div></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
